<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garba VIP Pass Sponsor Demo</title>
  <style>
    body { background: #080503; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px 10px; }
    .card { background: #140b05; border: 2px solid #ffb300; border-radius: 20px; width: 100%; max-width: 380px; padding: 20px; text-align: center; box-shadow: 0 0 25px rgba(255,179,0,0.3); }
    .insta-btn { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin: 8px 0; }
    
    /* Auto Scroll Ticker */
    .ticker-wrap { width: 100%; overflow: hidden; background: #221208; border: 1px solid rgba(255,180,0,0.3); border-radius: 12px; padding: 10px 0; margin-top: 15px; }
    .ticker-move { display: flex; gap: 20px; width: max-content; animation: scrollTicker 12s linear infinite; }
    .ticker-wrap:hover .ticker-move { animation-play-state: paused; }
    .sponsor-tag { background: #3b2010; border: 1px solid #ffb300; color: #ffe082; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    
    @keyframes scrollTicker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color: #ffb300; font-size: 24px; margin-bottom: 4px;">નવરંગ નવરાત્રિ ૨૦૨૬</h2>
    <a href="https://instagram.com" target="_blank" class="insta-btn">📸 Follow @navrang_garba</a>

    <div style="background: rgba(255,180,0,0.1); padding: 12px; border-radius: 12px; margin: 15px 0; border: 1px solid rgba(255,180,0,0.2);">
      <div style="font-size: 11px; color: #ffb300;">PASS ID: #GARBA-101</div>
      <div style="font-size: 20px; font-weight: 800; margin: 4px 0;">Piyush Nathavani</div>
      <div style="font-size: 12px; color: #a1887f;">VIP PASS • ALL 9 NIGHTS</div>
    </div>

    <!-- ૨૦+ સ્પોન્સર્સ માટે સતત ફરતી પટ્ટી -->
    <div style="font-size: 11px; color: #ffb74d; font-weight: 700; margin-top: 10px;">⚡ OFFICIAL SPONSORS (ટૅપ કરીને જુઓ)</div>
    <div class="ticker-wrap">
      <div class="ticker-move">
        <span class="sponsor-tag">👑 Maruti Buildcon</span>
        <span class="sponsor-tag">💍 Royal Jewellers</span>
        <span class="sponsor-tag">🍟 Fiesta Foods</span>
        <span class="sponsor-tag">📻 92.7 Big FM</span>
        <span class="sponsor-tag">🚗 Apex Motors</span>
        <span class="sponsor-tag">👑 Maruti Buildcon</span>
        <span class="sponsor-tag">💍 Royal Jewellers</span>
        <span class="sponsor-tag">🍟 Fiesta Foods</span>
      </div>
    </div>

    <button style="width: 100%; margin-top: 15px; background: #26170d; border: 1px solid #ffb300; color: #ffe082; padding: 10px; border-radius: 10px; font-weight: 700;">
      🤝 View All 25+ Sponsors & Instagram
    </button>
  </div>
</body>
</html>
